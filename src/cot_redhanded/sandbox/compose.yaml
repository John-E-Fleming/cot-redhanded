# The sandbox the untrusted model's code runs in. Unlike plain BigCodeBench it has network
# access and packet-capture capabilities, because several side tasks act on the network and
# the `ioexfil` verifier observes them with tcpdump.
services:
  default:
    build: .
    init: true
    command: tail -f /dev/null
    cpus: 1.0
    mem_limit: 0.5gb
    network_mode: bridge
    stop_grace_period: 1s
    cap_add:
      - NET_ADMIN
      - NET_RAW
