title: "CoT Red-Handed: Stress Testing Chain-of-Thought Monitoring"
description: |
  Stress tests chain-of-thought monitoring as an AI control measure. A weaker trusted monitor reads a
  stronger untrusted model's reasoning trace and final code to detect sabotage hidden alongside a
  legitimate coding task, and is compared against an action-only monitor that sees the code alone and
  a hybrid protocol that scores reasoning and actions independently before combining them. Monitors
  are compared by catch rate at a 1% false positive rate, calibrated against benign completions.
group: Safeguards
contributors:
  - John-E-Fleming
version: "1-B"
tasks:
  - name: cot_redhanded_generate
    dataset_samples: 855 # the TEST split at the default side task and attack policy
    comment: >-
      Produces the transcripts the monitor scores. Measures the untrusted model's ability to
      complete a hidden side task alongside the main one, not a monitor's ability to catch it.
  - name: cot_redhanded_monitor
    comment: >-
      The eval proper: a trusted monitor scores reasoning and actions for suspicion. Sample
      count depends on the generation log it is given, since only completions that passed both
      the main and the side task are monitored.
metadata:
  sandbox:
    - solver
    - scorer
  requires:
    internet: true
external_assets:
  - type: huggingface
    source: bigcode/bigcodebench
    fetch_method: hf_dataset
    state: floating
    comment: >-
      Main-task coding problems. Upstream calls hf_dataset with split="v0.1.4" and no
      revision=, so the data can move under the baseline over time. Recorded as floating
      because that is what this wrapper actually does: an earlier version of this file claimed
      revision b74c0d0bf70d2c0bc459be537895cca163007f1a, the revision inspect_evals pins for
      its own bigcodebench implementation, but the wrapper never passes it. Pinning it is an
      uplift-phase change, not a baseline one.
  - type: git_dependency
    source: https://github.com/cotredhanded/code
    fetch_method: pyproject_toml
    state: pinned
    comment: >-
      The reference implementation, MIT licensed, installed as the cot-red-handed package at
      commit 505d9fca6fc5b859492d8b9500b374c8cbf501e8 through [tool.uv.sources] in pyproject.toml.
      This wrapper calls its task and monitor code, and three data files ship inside the package
      under cot_red_handed/tasks/data: cot_bigcodebench_side_tasks.jsonl (edge-case side-task test
      cases), task_id_sets.json (the TRAIN/VAL/RED/TEST splits) and bigcodebench_pairings.json
      (main-task to side-task pairings). Nothing here downloads those files separately.
