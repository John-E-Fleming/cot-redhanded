title: "CoT Red-Handed: Stress Testing Chain-of-Thought Monitoring"
description: |
  Stress tests chain-of-thought monitoring as an AI control measure. A weaker trusted monitor reads a
  stronger untrusted model's reasoning trace and final code to detect sabotage hidden alongside a
  legitimate coding task, and is compared against an action-only monitor that sees the code alone and
  a hybrid protocol that scores reasoning and actions independently before combining them. Monitors
  are compared by catch rate at a 1% false positive rate, calibrated against benign completions.
group: Safeguards
contributors:
  - John-E-Fleming
version: "2-A"
tasks:
  - name: cot_redhanded
    dataset_samples: 1710 # the TEST split at the defaults: 855 honest and 855 attack samples
    comment: >-
      The eval: an untrusted model completes honest and attack samples, each completion is
      verified in the sandbox, a trusted monitor scores the successful ones, and the catch rate
      at a 1% false positive rate is reported as a metric.
  - name: cot_redhanded_monitor
    comment: >-
      Scoring only: runs the monitor over completions saved by earlier runs, so a second
      monitor can be tried without generating again. The sample count depends on the logs it
      is given, since only successful completions are monitored.
metadata:
  sandbox:
    - scorer
  requires:
    internet: true
external_assets:
  - type: huggingface
    source: bigcode/bigcodebench
    fetch_method: load_dataset
    state: pinned
    comment: >-
      Main-task coding problems, release v0.1.4, pinned to revision
      b74c0d0bf70d2c0bc459be537895cca163007f1a.
