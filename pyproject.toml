[build-system]
requires = ["setuptools>=77"] # 77 is the first to accept an SPDX string in [project] license
build-backend = "setuptools.build_meta"

[project]
name = "cot-redhanded"
version = "0.1.0"
description = "Stress testing chain-of-thought monitoring"
readme = "README.md"
license = "MIT"
authors = [{ name = "John-E-Fleming", email = "jfleming9317@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "inspect_ai>=0.3.262",
    "inspect-evals-utils[huggingface]==0.3.0",
]

[project.urls]
Repository = "https://github.com/John-E-Fleming/cot-redhanded"
Issues = "https://github.com/John-E-Fleming/cot-redhanded/issues"

# Registers the package so `inspect eval cot_redhanded/<task>` finds its tasks.
[project.entry-points.inspect_ai]
cot_redhanded = "cot_redhanded"

[dependency-groups]
dev = [
    "anthropic>=2.0", # with openai, the SDKs behind the `--model` commands in the READMEs
    "basedpyright>=1.40",
    "inspect-evals-lint==0.13.0",
    "inspect-scout>=0.6.2", # used by agent_artefacts/trajectory_analysis/inspect_scout/
    "openai>=3.4",
    "pre-commit>=4.0",
    "pytest>=8.4",
    "pytest-asyncio",
    "pytest-dotenv",
    "pytest-inspect-evals[huggingface]==0.4.0",
    "pytest-mock",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cot_redhanded*"] # examples/ stays out of the wheel

[tool.setuptools.package-data]
"*" = ["eval.yaml", "data/*", "sandbox/*"]

# Layout preset: multi-eval (tests/<package>/, src/<package>/README.md) or
# single-eval (flat tests/, README at the root). A hybrid repo keeps a preset and
# sets tests_layout or readme_location here on top of it.
[tool.inspect-evals-lint]
preset = "multi-eval"

# The `ioexfil` side task is verified by capturing the sandbox's own network traffic with
# tcpdump, which needs these two capabilities. They apply inside the container only.
[tool.inspect-evals-lint.allowlists]
sandbox_privileges = { cot_redhanded = ["default:cap_add:NET_ADMIN", "default:cap_add:NET_RAW"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-rA --durations=10 --color=yes"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_level = "WARNING"
env_files = [".env"]
# Test gates and markers come from pytest-inspect-evals. Dataset-download tests
# run by default; set RUN_DATASET_DOWNLOAD_TESTS=0 to skip them.
inspect_evals_dataset_download = true

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
exclude = [".venv", "agent_artefacts", "build"]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"
# *.md: ruff formats Python blocks in Markdown, and the README generator writes them its own way.
extend-exclude = ["agent_artefacts", "*.md"]

[tool.ruff.lint]
# IECQ007 asks for PLW1514 (unspecified-encoding). It is a preview rule, so selecting PLW
# alone leaves it off and enabling it needs preview = true — which also activates
# rule-codes-in-selectors and would rewrite every code in this file to a rule name. Deferred
# deliberately: IECQ007 is a warning, not a required check, and the code reads no files
# without an explicit encoding.
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "D",     # pydocstyle
    "C4",    # flake8-comprehensions
    "PT",    # flake8-pytest-style
    "PIE",   # flake8-pie
    "DTZ",   # flake8-datetimez (timezone-aware datetimes)
    "ISC",   # implicit-str-concat (catches missing commas)
    "ASYNC", # flake8-async
    "N",     # pep8-naming
    "FURB",  # refurb (modernization)
    "RUF",   # ruff-specific rules
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
]
ignore = [
    "E501",   # line-too-long: the formatter owns line length
    "D10",    # missing docstrings
    "D415",   # first-line punctuation
    "ISC001", # single-line implicit concat conflicts with the formatter
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/{tests,examples}/**" = ["D", "PLR2004"] # tests and examples skip docstring linting
# The prompts are the reference implementation's text, character for character, and some of
# its lines end in a space that reaches the model.
"src/cot_redhanded/prompts.py" = ["W291"]
